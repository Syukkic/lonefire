[package]
name = "lonefire"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.97"
dirs = "6.0.0"
futures = "0.3.31"
indicatif = "0.17.11"
regex = "1.11.1"
reqwest = { version = "0.12.15", features = ["stream"] }
scraper = "0.23.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.1", features = ["macros", "rt-multi-thread"] }
url = "2.5.4"


[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
